[package]
name = "LiveWallpaper"
version = "0.1.0"
edition = "2024"

[dependencies]
# Thư viện xây dựng giao diện GTK4 cho GNOME
gtk = { version = "0.8", package = "gtk4", features = ["v4_12"] }

# Thư viện decode và phát video mạnh mẽ nhất trên Linux
gst = { version = "0.22", package = "gstreamer" }
gst-video = { version = "0.22", package = "gstreamer-video" }
gst-play = { version = "0.22", package = "gstreamer-play" }

# Thư viện hỗ trợ tương tác với X11/Wayland window layer
glib = "0.19"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
x11-dl = "2.21"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true